<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Veterinaria</title>

<style>

body{
font-family:Arial;
margin:0;
padding:0;

/* Fondo con patrón de huellas */

background-color:#2ecc71;

background-image:
radial-gradient(circle at 10px 10px, rgba(255,255,255,0.3) 6px, transparent 7px),
radial-gradient(circle at 30px 30px, rgba(255,255,255,0.3) 6px, transparent 7px);

background-size:60px 60px;
}

/* contenedores transparentes tipo vidrio */

.contenedor{
width:450px;
margin:auto;
margin-top:50px;
padding:25px;

background:rgba(255,255,255,0.2);

backdrop-filter:blur(10px);

border-radius:15px;

box-shadow:0 8px 25px rgba(0,0,0,0.2);

color:white;
}

h2{
text-align:center;
}

input,select,textarea{

width:95%;
padding:10px;
margin:6px;

border-radius:8px;

border:none;

background:rgba(255,255,255,0.7);

}

textarea{
height:60px;
}

button{

padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
margin:3px;
}

.btn{

background:#4b35d6;

color:white;

width:100%;

font-weight:bold;

}

.btn:hover{

background:#3625a5;

}

/* tabla */

.tabla{

width:95%;
margin:auto;
margin-top:30px;
border-collapse:collapse;

background:rgba(255,255,255,0.9);

border-radius:10px;

overflow:hidden;

}

.tabla th,.tabla td{

padding:10px;
border:1px solid #ddd;
text-align:center;

}

.editar{

background:#3498db;
color:white;

}

.eliminar{

background:#e74c3c;
color:white;

}

#panel{

display:none;

}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="contenedor" id="login">

<h2>Sistema Veterinaria</h2>

<input id="usuarioLogin" placeholder="Usuario">
<input id="passLogin" type="password" placeholder="Contraseña">

<button class="btn" onclick="login()">Entrar</button>

<p style="text-align:center">¿No tienes cuenta?</p>

<button class="btn" onclick="mostrarRegistro()">Crear cuenta</button>

</div>


<!-- REGISTRO -->
<div class="contenedor" id="registro" style="display:none">

<h2>Registro de Usuario</h2>

<input id="nombre" placeholder="Nombre completo">
<input id="usuario" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<button class="btn" onclick="registrar()">Registrar</button>

<button class="btn" onclick="mostrarLogin()">Volver</button>

</div>



<!-- PANEL -->
<div id="panel">

<div class="contenedor">

<h2 id="bienvenida"></h2>

<h3>Crear Cita Veterinaria</h3>

<input id="mascota" placeholder="Nombre de la mascota">

<select id="tipo">
<option>Perro</option>
<option>Gato</option>
<option>Ave</option>
<option>Conejo</option>
<option>Otro</option>
</select>

<input id="raza" placeholder="Raza">

<input id="dueno" placeholder="Nombre del dueño">

<textarea id="sintomas" placeholder="Síntomas del animal"></textarea>

<input id="fecha" type="date">
<input id="hora" type="time">

<button class="btn" onclick="guardarCita()">Guardar Cita</button>

<button class="btn" onclick="cerrarSesion()">Cerrar sesión</button>

</div>


<table class="tabla">

<thead>
<tr>
<th>Mascota</th>
<th>Tipo</th>
<th>Raza</th>
<th>Dueño</th>
<th>Síntomas</th>
<th>Fecha</th>
<th>Hora</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaCitas"></tbody>

</table>

</div>


<script>

let indiceEditar=null

function mostrarRegistro(){
document.getElementById("login").style.display="none"
document.getElementById("registro").style.display="block"
}

function mostrarLogin(){
document.getElementById("registro").style.display="none"
document.getElementById("login").style.display="block"
}

function registrar(){

let nombre=document.getElementById("nombre").value.trim()
let usuario=document.getElementById("usuario").value.trim()
let pass=document.getElementById("pass").value.trim()

if(nombre=="" || usuario=="" || pass==""){
alert("Completa todos los campos")
return
}

let datos={nombre,usuario,pass}

localStorage.setItem("user_"+usuario,JSON.stringify(datos))

alert("Cuenta creada correctamente")

mostrarLogin()

}

function login(){

let usuario=document.getElementById("usuarioLogin").value
let pass=document.getElementById("passLogin").value

let datos=localStorage.getItem("user_"+usuario)

if(datos){

let u=JSON.parse(datos)

if(u.pass===pass){

document.getElementById("login").style.display="none"
document.getElementById("panel").style.display="block"

document.getElementById("bienvenida").innerHTML="Bienvenido "+u.nombre+" 🐾"

cargarCitas()

}else{

alert("Contraseña incorrecta")

}

}else{

alert("Usuario no encontrado")

}

}

function cerrarSesion(){

document.getElementById("panel").style.display="none"
document.getElementById("login").style.display="block"

}

function guardarCita(){

let mascota=document.getElementById("mascota").value
let tipo=document.getElementById("tipo").value
let raza=document.getElementById("raza").value
let dueno=document.getElementById("dueno").value
let sintomas=document.getElementById("sintomas").value
let fecha=document.getElementById("fecha").value
let hora=document.getElementById("hora").value

let citas=JSON.parse(localStorage.getItem("citas"))||[]

if(indiceEditar===null){

citas.push({mascota,tipo,raza,dueno,sintomas,fecha,hora})

}else{

citas[indiceEditar]={mascota,tipo,raza,dueno,sintomas,fecha,hora}
indiceEditar=null

}

localStorage.setItem("citas",JSON.stringify(citas))

limpiar()

cargarCitas()

}

function cargarCitas(){

let citas=JSON.parse(localStorage.getItem("citas"))||[]

let tabla=document.getElementById("tablaCitas")

tabla.innerHTML=""

citas.forEach((c,i)=>{

tabla.innerHTML+=`
<tr>
<td>${c.mascota}</td>
<td>${c.tipo}</td>
<td>${c.raza}</td>
<td>${c.dueno}</td>
<td>${c.sintomas}</td>
<td>${c.fecha}</td>
<td>${c.hora}</td>
<td>
<button class="editar" onclick="editar(${i})">Editar</button>
<button class="eliminar" onclick="eliminar(${i})">Eliminar</button>
</td>
</tr>
`

})

}

function editar(i){

let citas=JSON.parse(localStorage.getItem("citas"))

let c=citas[i]

document.getElementById("mascota").value=c.mascota
document.getElementById("tipo").value=c.tipo
document.getElementById("raza").value=c.raza
document.getElementById("dueno").value=c.dueno
document.getElementById("sintomas").value=c.sintomas
document.getElementById("fecha").value=c.fecha
document.getElementById("hora").value=c.hora

indiceEditar=i

}

function eliminar(i){

let citas=JSON.parse(localStorage.getItem("citas"))

citas.splice(i,1)

localStorage.setItem("citas",JSON.stringify(citas))

cargarCitas()

}

function limpiar(){

document.getElementById("mascota").value=""
document.getElementById("raza").value=""
document.getElementById("dueno").value=""
document.getElementById("sintomas").value=""
document.getElementById("fecha").value=""
document.getElementById("hora").value=""

}

</script>

</body>
</html>
